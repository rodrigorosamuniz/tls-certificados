name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Python modules
        run: python -m compileall app scripts tests

      - name: Run unit tests
        run: python -m unittest discover tests

      - name: Validate notebook JSON
        run: python -m json.tool lab_tls_certificados_https.ipynb > /dev/null

      - name: Generate certificates
        run: python scripts/generate_certs.py --output-dir certs

      - name: Validate Docker Compose
        run: docker compose config
