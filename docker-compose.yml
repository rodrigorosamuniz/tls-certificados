services:
  http:
    image: python:3.12-slim
    working_dir: /lab
    command: python app/server.py --host 0.0.0.0 --port 8080
    ports:
      - "18080:8080"
    volumes:
      - .:/lab

  https:
    image: python:3.12-slim
    working_dir: /lab
    command: python app/server.py --host 0.0.0.0 --port 8443 --certfile certs/localhost.crt --keyfile certs/localhost.key
    ports:
      - "18443:8443"
    volumes:
      - .:/lab
